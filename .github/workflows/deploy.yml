# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# Enable Pages in the repository settings (Source: GitHub Actions) once.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project site: https://<owner>.github.io/<repo>/ — adjust when a custom domain is attached.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
          # Alpha: set the ALPHA_PASSWORD repository secret to put the page behind a password
          # (StatiCrypt, client-side AES; crawlers get noindex + robots Disallow). Remove the secret to open the site.
          ALPHA_PASSWORD: ${{ secrets.ALPHA_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
